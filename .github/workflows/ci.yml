name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests serving scripts dags

  data-contract:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Data tests
        run: pytest tests/test_data.py tests/test_monitoring.py -v --junitxml=reports/data-tests.xml
      - name: Show that a corrupt file is rejected
        run: python scripts/ci_gate.py --expect-reject
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-reports
          path: reports/

  model-quality:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Model and serving tests
        run: pytest tests/test_model.py tests/test_serving.py -v --junitxml=reports/model-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-reports
          path: reports/
